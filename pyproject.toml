[project]
name = "meeting-notes-agent"
version = "0.1.0"
description = "무료 STT 모델 기반 사내 회의록 자동 정리 에이전트"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.4.0",
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "python-multipart>=0.0.33",
    "pywebpush>=2.5.0",
    "torch>=2.8.0",
    "torchaudio>=2.8.0",
    "torchvision>=0.23.0",
    "uvicorn>=0.54.0",
    "whisperx>=3.8.6",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
